name: Sync plugin branch

on:
  push:
    branches:
      - main

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push addons folder to plugin branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: plugin
          FOLDER: addons/gd-fsrs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
